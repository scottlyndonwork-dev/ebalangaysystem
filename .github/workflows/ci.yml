name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ebalangay
          POSTGRES_PASSWORD: ebalangay
          POSTGRES_DB: ebalangay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ebalangay" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      # Superuser: only for creating extensions and the app role.
      ADMIN_DATABASE_URL: postgresql://ebalangay:ebalangay@localhost:5432/ebalangay_test
      # Non-superuser that owns the schema, like local dev, so RLS is actually enforced in tests.
      DATABASE_URL: postgresql://ebalangay_app:ebalangay_app@localhost:5432/ebalangay_test
      TEST_DATABASE_URL: postgresql://ebalangay_app:ebalangay_app@localhost:5432/ebalangay_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1
      TURBO_TELEMETRY_DISABLED: 1
      # On PRs only affected packages run; on main everything runs.
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && '--filter=...[origin/main]' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prepare test DB (extensions schema + non-superuser app role, like local dev)
        run: >-
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1
          -c "CREATE ROLE ebalangay_app LOGIN PASSWORD 'ebalangay_app';"
          -c "ALTER DATABASE ebalangay_test OWNER TO ebalangay_app;"
          -c "ALTER SCHEMA public OWNER TO ebalangay_app;"
          -c "CREATE SCHEMA IF NOT EXISTS extensions;"
          -c "CREATE EXTENSION IF NOT EXISTS postgis SCHEMA extensions;"
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA extensions;"
          -c "GRANT USAGE ON SCHEMA extensions TO ebalangay_app;"
          -c "ALTER ROLE ebalangay_app SET search_path = public, extensions;"

      - name: Apply migrations to test DB
        run: pnpm --filter @ebalangay/api exec prisma migrate deploy

      - name: Lint, typecheck, test
        run: pnpm turbo run lint typecheck test $TURBO_FILTER

      - name: Prettier
        run: pnpm format:check
